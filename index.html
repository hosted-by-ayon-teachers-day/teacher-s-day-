<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Happy Teacher's Day — LJD PUBLIC SCHOOL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home" class="home">
  <div class="glow glow-a"></div><div class="glow glow-b"></div>
  <header class="hero">
    <div class="eyebrow">LJD PUBLIC SCHOOL</div>
    <h1>Happy<br><span>Teacher's Day</span></h1>
    <p>A little tribute to the people who inspire us to learn, grow and become better every day.</p>
    <div class="rule"></div>
    <div class="choose">CHOOSE A TEACHER</div>
  </header>
  <section id="teacherGrid" class="grid" aria-label="Teachers"></section>
  <footer>Made with gratitude • LJD PUBLIC SCHOOL</footer>
</main>

<section id="viewer" class="viewer" aria-hidden="true">
  <button id="backBtn" class="back" aria-label="Back to teachers">← <span>Teachers</span></button>
  <div class="counter" id="counter"></div>
  <img id="teacherImage" alt="Teacher's Day tribute">
  <div class="viewerShade"></div>
</section>
<script src="script.js"></script>
</body></html>
